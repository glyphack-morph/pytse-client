[project]
name = "pytse-client"
version = "0.19.1"
description = "tehran stock exchange(TSE) client in python"
authors = [{ name = "glyphack", email = "sh.hooshyari@gmail.com" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
# Python 3.10 and older are end of life, and the soupsieve releases
# without known vulnerabilities (pulled in by beautifulsoup4) need
# 3.11.5. uv.lock pins the newest versions that pass uv audit, the
# lower bounds below are only what the code needs.
requires-python = ">=3.11.5"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.9.3",
    "jdatetime>=4.0",
    "pandas>=2.2.2",
    "requests>=2.28",
    "tenacity>=8.0",
    "urllib3>=1.26",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "parameterized>=0.9.0",
    "pylint>=4.1.4",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./pytse_client, not ./src/pytse_client.
module-root = ""

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
src_paths = ["isort", "test"]
line_length = 79
